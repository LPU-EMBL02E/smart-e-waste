# Pint and the test suite for the Laravel app (AGENTS.md §8). Runs on every PR
# so it can be a required check on main.
name: Web

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # PHP 8.4 as on the Pi (System_Plan.md §3). The tests use in-memory SQLite
      # (phpunit.xml), so no database server is needed.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, curl, bcmath, zip, pdo_sqlite
          coverage: none

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('web/composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # A throwaway key for this run only; never reused anywhere.
      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: ./vendor/bin/pint --test

      - name: Tests
        run: php artisan test
