                display: grid;
                gap: 2rem;
                align-items: start;
                padding-block: 2rem;
            }
            .intro .intro-title {
                font-size: 2.5rem;
                font-weight: 800;
                line-height: 1.1;
                letter-spacing: -0.02em;
            }
            .intro > p + p {
                margin-top: 1rem;
                max-width: 38ch;
            }
            .portal-notes {
                display: none;
            }
            .panel {
                width: 100%;
                max-width: 36rem;
            }
            .panel h1 + p {
                color: var(--muted);
                margin-top: 0.75rem;
            }
            .panel form {
                margin-top: 1.5rem;
            }
            .panel .field + .field {
                margin-top: 1.5rem;
            }
            .panel form > .primary {
                width: 100%;
                margin-top: 1.5rem;
            }
            .text-link,
            .preview-links a {
                display: inline-flex;
                align-items: center;
                min-height: 2.75rem;
            }
            .text-link {
                margin-top: 0.75rem;
            }
            .account-help {
                border-top: 1px solid var(--ink);
                padding-top: 1.5rem;
                margin-top: 1.5rem;
            }
            .account-help p {
                color: var(--muted);
                margin-top: 0.25rem;
                font-size: 0.875rem;
            }
            .result {
                margin-top: 1.5rem;
            }
            .review {
                border-top: 2px solid var(--ink);
                padding-block: 1.5rem 2rem;
            }
            .review summary {
                width: fit-content;
                min-height: 2.75rem;
                padding-block: 0.75rem;
                cursor: pointer;
                font-weight: 600;
            }
            .review-content {
                display: grid;
                gap: 1rem;
                padding-top: 0.75rem;
            }
            code {
                font-size: 0.875em;
                overflow-wrap: anywhere;
            }
            noscript p {
                padding: 1.5rem;
                border: 2px solid var(--danger);
            }
            @media (max-width: 39.999rem) {
                .table-wrap::before {
                    content: "Scroll to see all columns.";
                    display: block;
                    font-size: 0.875rem;
                    color: var(--muted);
                    margin-bottom: 0.75rem;
                }
            }
            @media (min-width: 40rem) {
                :root {
                    --gutter: 1.5rem;
                }
                .card-pad,
                .card-body,
                .panel,
                .tile {
                    padding: 1.5rem;
                }
                .stats,
                .tiles,
                .reward-grid,
                .form-grid,
                .flow-wrap {
                    grid-template-columns: repeat(2, minmax(0, 1fr));
                }
                .top-right .mock-label {
                    display: inline-flex;
                }
                .dashboard-sections > .stack {
                    grid-template-columns: repeat(2, minmax(0, 1fr));
                }
                .nav,
                .wf-sidebar nav {
                    grid-template-columns: repeat(3, minmax(0, 1fr));
                }
            }
            @media (min-width: 64rem) {
                :root {
                    --gutter: 2rem;
                }
                h1 {
                    font-size: 2rem;
                }
                h2,
                .card-title {
                    font-size: 1.5rem;
                }
                .app,
                .wf-app {
                    display: grid;
                    grid-template-columns: 15rem minmax(0, 1fr);
                }
                .sidebar,
                .wf-sidebar {
                    position: sticky;
                    top: 0;
                    align-self: start;
                    max-height: 100vh;
                    overflow-y: auto;
                    border-right: 2px solid var(--ink);
                    border-bottom: 0;
                }
                .nav,
                .wf-sidebar nav {
                    grid-template-columns: minmax(0, 1fr);
                }
                .content,
                .wf-canvas {
                    padding-block: 3rem;
                }
                .points-panel .stat-num {
                    font-size: 3rem;
                }
                .layout {
                    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                    gap: 4rem;
                    padding-block: 4rem;
                }
                .intro {
                    padding-top: 1rem;
                }
                .intro .intro-title {
                    font-size: 3rem;
                }
                .intro > p + p {
                    margin-top: 1.5rem;
                }
                .portal-notes {
                    display: grid;
                    gap: 1rem;
                    border-top: 4px solid var(--lavender);
                    margin-top: 2rem;
                    padding-top: 1.5rem;
                }
                .portal-notes p {
                    color: var(--muted);
                    font-size: 0.875rem;
                }
            }
            @media (min-width: 75rem) {
                .stats {
                    grid-template-columns: repeat(4, minmax(0, 1fr));
                }
                .tiles {
                    grid-template-columns: repeat(5, minmax(0, 1fr));
                    gap: 1rem;
                }
                .cols {
                    grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
                    align-items: start;
                }
                .reward-grid {
                    grid-template-columns: repeat(3, minmax(0, 1fr));
                }
            }
            @media (hover: hover) and (pointer: fine) {
                button:not(:disabled):hover,
                .button:not(:disabled):hover {
                    background: var(--lavender-wash);
                }
                button.primary:not(:disabled):hover,
                .button.primary:not(:disabled):hover {
                    background: var(--lavender-strong);
                }
            }
            @media (prefers-reduced-motion: reduce) {
                *,
                *::before,
                *::after {
                    animation: none !important;
                    transition: none !important;
                }
                .primary:not(:disabled):active {
                    transform: none;
                }
            }

            /* additions for this prototype only; tokens come from wireframe.css */
            .meter {
                display: inline-block;
                width: 64px;
                height: 12px;
                border: 2px solid var(--ink);
                border-radius: 2px;
                background: var(--paper);
                vertical-align: middle;
                margin-right: 8px;
                position: relative;
            }
            .meter i {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                background: var(--lavender-strong);
                border-right: 2px solid var(--ink);
            }
            .meter.none i {
                display: none;
            }
            .brand-row {
                display: flex;
                gap: 12px;
                align-items: center;
                padding: 8px 0 16px;
            }
            .brand-row img {
                width: 44px;
                height: 44px;
                border: 2px solid var(--ink);
                border-radius: 4px;
                background: var(--paper);
            }
            .brand-row small {
                display: block;
                color: var(--muted);
                font-size: 0.75rem;
                line-height: 1.3;
            }
            .brand-row img {
                background: #1a0b3b;
            }
            .tile-value {
                color: var(--ink);
            }
            .plain-title {
                font-size: 1.25rem;
                font-weight: 700;
                margin: 24px 0 12px;
            }
            .skip {
                position: absolute;
                left: -999px;
            }
            .skip:focus {
                left: 8px;
                top: 8px;
                background: var(--paper);
                padding: 8px;
                border: 2px solid var(--ink);
                z-index: 9;
            }
            .stack-gap > * + * {
                margin-top: 24px;
            }
            .inline-form {
                display: grid;
                gap: 16px;
                max-width: 36rem;
            }
            .error-text {
                color: var(--danger);
                font-size: 0.875rem;
                margin-top: 4px;
            }
            .flash {
                border: 2px solid var(--ink);
                border-radius: 4px;
                padding: 12px 16px;
                background: var(--lavender-wash);
                margin-bottom: 16px;
            }
        </style>
    </head>

            /* ---------- illustrative sample data (a real page receives these from the server) ---------- */
            const ORGS = [

            const STUDENTS = [

                ["Paolo Garcia", 2],

                ["Danica Cruz", 0],
                ["Rico Navarro", 1],
                ["Trisha Lim", 2],
                ["Marco Bautista", 3],
                ["Sofia Ramos", 4],
                ["Gab Villanueva", 1],

                no: "2026-" + String(1101 + i * 7).padStart(5, "0"),

                org: ORGS[s[1]],

            const BINS = [
                {

                {
                    code: "BIN-02",
                    name: "Bin 2",
                    loc: "Library entrance",
                    fill: 92,
                    status: "FULL",

                    fill: null,
                    status: null,

                },
            ];
            let seed = 7;
            const rnd = () =>
                (seed = (seed * 1664525 + 1013904223) % 4294967296) /
                4294967296;
            const TX = [];
            for (let i = 0; i < 30; i++) {
                const s = STUDENTS[Math.floor(rnd() * STUDENTS.length)];
                const w = Math.round((40 + rnd() * 480) * 10) / 10;
                const st = i === 4 ? "VOIDED" : "COMPLETED";
                const d = new Date(
                    2026,
                    9,
                    24 - Math.floor(i / 4),
                    16 - (i % 7),
                    (i * 13) % 60,
                );
                TX.push({
                    code:
                        "TXN-2026" +
                        ("10" + (24 - Math.floor(i / 4))).slice(-4) +
                        "-" +
                        (1000 + i * 37).toString(36).toUpperCase(),
                    date: d,
                    stu: s,
                    bin: BINS[i % 2].code,
                    w,
                    pts: st === "COMPLETED" ? Math.floor(w / 10) : 0,
                    status: st,
                });
            }
            const REWARDS = [
                { name: "Eco tote bag", pts: 200, stock: 15, on: true },
                { name: "Notebook set", pts: 120, stock: 30, on: true },
                {
                    name: "Canteen voucher (PHP 50)",
                    pts: 300,
                    stock: 10,
                    on: true,
                },
                { name: "Ballpen set", pts: 60, stock: 50, on: true },
                { name: "Organization T-shirt", pts: 500, stock: 0, on: false },
                { name: "Reusable tumbler", pts: 400, stock: 8, on: true },
            ];
            const REDS = [
                {
                    id: "RDM-0301",
                    stu: STUDENTS[0],
                    reward: "Eco tote bag",
                    pts: 200,
                    date: "2026-10-23",
                    status: "PENDING",
                },
                {
                    id: "RDM-0300",
                    stu: STUDENTS[3],
                    reward: "Notebook set",
                    pts: 120,
                    date: "2026-10-23",
                    status: "PENDING",
                },
                {
                    id: "RDM-0299",
                    stu: STUDENTS[8],
                    reward: "Canteen voucher (PHP 50)",
                    pts: 300,
                    date: "2026-10-22",
                    status: "FULFILLED",
                },
                {
                    id: "RDM-0298",
                    stu: STUDENTS[2],
                    reward: "Ballpen set",
                    pts: 60,
                    date: "2026-10-21",
                    status: "FULFILLED",
                },
                {
                    id: "RDM-0297",
                    stu: STUDENTS[6],
                    reward: "Ballpen set",
                    pts: 60,
                    date: "2026-10-19",
                    status: "CANCELLED",
                },
            ];
            const SESSIONS = [
                {
                    id: "b3f1…",
                    stu: STUDENTS[1],
                    bin: "BIN-01",
                    w: 184.6,
                    at: "2026-10-24 09:41",
                    wait: "12 min",
                },
            ];
            const REGS = [
                {
                    id: 1,
                    first: "Kyle",
                    last: "Mercado",
                    no: "2026-02210",
                    email: "kyle.mercado@example.test",
                    org: ORGS[4],
                    status: "PENDING",
                },
                {
                    id: 2,
                    first: "Lea",
                    last: "Ocampo",
                    no: "2026-02214",
                    email: "lea.ocampo@example.test",
                    org: ORGS[1],
                    status: "PENDING",
                },
                {
                    id: 3,
                    first: "Noel",
                    last: "Pascual",
                    no: "2026-02198",
                    email: "noel.pascual@example.test",
                    org: ORGS[0],
                    status: "APPROVED",
                },
            ];
            /* ---------- helpers ---------- */
            const $ = (s, r = document) => r.querySelector(s);
            const fmt = (d) =>
                d.toLocaleDateString("en-CA") +
                " " +
                d.toLocaleTimeString("en-GB", {
                    hour: "2-digit",
                    minute: "2-digit",
                });
            const cls = {
                APPROVED: "ok",
                DENIED: "danger",
                COMPLETED: "ok",
                FULFILLED: "ok",
                OK: "ok",
                ACTIVE: "ok",
                PENDING: "warn",
                FULL: "warn",
                VOIDED: "danger",
                CANCELLED: "danger",
                INACTIVE: "warn",
            };
            const pill = (t) =>
                `<span class="pill ${cls[t] || ""}">${t}</span>`;
            const g = (n) =>
                n.toLocaleString("en-US", {
                    minimumFractionDigits: 1,
                    maximumFractionDigits: 1,
                });
            const completed = () => TX.filter((t) => t.status === "COMPLETED");
            const head = (t, meta) =>
                `<div class="screen-head"><h1 tabindex="-1">${t}</h1><div class="meta">${meta}</div></div>`;
            const table = (label, cols, rows, empty) =>
                `<div class="card"><div class="card-body"><div class="table-wrap" role="region" tabindex="0" aria-label="${label}"><table class="wf-table"><caption class="hidden">${label}</caption><thead><tr>${cols.map((c) => `<th scope="col"${c[0] === "#" ? ' class="numeric"' : ""}>${c.replace(/^#/, "")}</th>`).join("")}</tr></thead><tbody>${rows.length ? rows.join("") : `<tr><td colspan="${cols.length}">${empty || "No records."}</td></tr>`}</tbody></table></div></div></div>`;
            const meter = (f) =>
                f == null
                    ? `<span class="meter none"></span>No reading`
                    : `<span class="meter"><i style="width:${f}%"></i></span>${f}%`;
            const tile = (l, v, f) =>
                `<div class="tile"><div class="tile-label">${l}</div><div class="tile-value">${v}</div><div class="tile-foot">${f}</div></div>`;
            const binRows = (a) =>
                BINS.map(
                    (b) =>
                        `<tr><td>${b.code}</td>${a ? `<td>${b.name}</td><td>${b.loc}</td>` : `<td>${b.name}</td>`}<td class="numeric">${meter(b.fill)}</td><td>${b.status ? pill(b.status) : "—"}</td><td>${b.seen}</td></tr>`,
                );
            function toast(m) {
                const f = $("#flash");
                if (f) {
                    f.textContent = m;
                    f.hidden = false;
                }
            }
            /* ---------- screens ---------- */
            const SCREENS = {
                dashboard: {
                    t: "Dashboard",
                    group: "Monitoring",
                    html() {
                        const c = completed(),
                            today = c.filter((t) => t.date.getDate() === 24),
                            pend = REDS.filter(
                                (r) => r.status === "PENDING",
                            ).length;
                        return (
                            head(
                                "Dashboard",
                                "Collection summary · times in Asia/Manila",
                            ) +
                            `<div class="toolbar"><div><b>Collection summary</b></div><div class="wf-live">Demo · no live polling</div></div>
<div class="tiles">${tile("Today's deposits", today.length, "Completed since midnight")}${tile("Today's weight (g)", g(today.reduce((a, t) => a + t.w, 0)), "Net weight, completed deposits")}${tile(
                                "Today's points awarded",
                                today.reduce((a, t) => a + t.pts, 0),
                                "Points credited",
                            )}${tile("Pending redemptions", pend, "Awaiting fulfil or cancel")}${tile("Sessions awaiting review", SESSIONS.length, "Waiting past the review time")}</div>
<h2 class="plain-title">Bins</h2>` +
                            table(
                                "Bins",
                                [
                                    "Device code",
                                    "Name",
                                    "#Fill",
                                    "Status",
                                    "Last seen",
                                ],
                                binRows(false),
                            ) +
                            `<div class="btn-row" style="margin-top:16px"><button class="btn" data-go="transactions">Go to transactions</button><button class="btn" data-go="redemptions">Go to redemptions</button></div>`
                        );
                    },
                },
                bins: {
                    t: "Bins",
                    group: "Monitoring",
                    html() {
                        return (
                            head(
                                "Bins",
                                "Bin level from the ultrasonic sensor · status is set by the server",
                            ) +
                            table(
                                "Bins",
                                [
                                    "Device code",
                                    "Name",
                                    "Location",
                                    "#Fill",
                                    "Status",
                                    "Last seen",
                                ],
                                binRows(true),
                            ) +
                            `<p class="annotation" style="margin-top:12px">A bin with no reading shows “No reading”, never 0% or a healthy status.</p>`
                        );
                    },
                },
                leaderboard: {
                    t: "Organization leaderboard",
                    group: "Monitoring",
                    html() {
                        const rows = ORGS.map((o) => {
                            const us = STUDENTS.filter((s) => s.org === o);
                            const tx = completed().filter((t) =>
                                us.includes(t.stu),
                            );
                            return {
                                o,
                                n: us.length,
                                d: tx.length,
                                w: tx.reduce((a, t) => a + t.w, 0),
                                p: tx.reduce((a, t) => a + t.pts, 0),
                            };
                        }).sort((a, b) => b.w - a.w);
                        return (
                            head(
                                "Organization leaderboard",
                                "Ranked by total collected weight (net_weight_g) · ranking basis is a team decision",
                            ) +
                            table(
                                "Organization ranking",
                                [
                                    "Rank",
                                    "Organization",
                                    "#Students",
                                    "#Deposits",
                                    "#Weight (g)",
                                    "#Points earned",
                                ],
                                rows.map(
                                    (r, i) =>
                                        `<tr><td>${i + 1}</td><td>${r.o}</td><td class="numeric">${r.n}</td><td class="numeric">${r.d}</td><td class="numeric">${g(r.w)}</td><td class="numeric">${r.p}</td></tr>`,
                                ),
                            )
                        );
                    },
                },
                transactions: {
                    t: "Transactions",
                    group: "Deposits",
                    html() {
                        return (
                            head(
                                "Transactions",
                                "All deposits recorded by the bins",
                            ) +
                            `<div class="tiles">${tile("Total collected weight (g)", g(completed().reduce((a, t) => a + t.w, 0)), "Net weight, completed deposits · COMPLETED only · voided excluded")}</div>
<div class="toolbar" style="margin-top:16px"><div class="filters"><div class="field"><label for="q">Search code or student</label><input id="q" type="search"></div><div class="field"><label for="st">Status</label><select id="st"><option value="">All</option><option>COMPLETED</option><option>VOIDED</option></select></div></div></div><div id="out"></div>`
                        );
                    },
                    init() {
                        const d = () => {
                            const q = $("#q").value.toLowerCase(),
                                s = $("#st").value;
                            const r = TX.filter(
                                (t) =>
                                    (!s || t.status === s) &&
                                    (!q ||
                                        (t.code + t.stu.name)
                                            .toLowerCase()
                                            .includes(q)),
                            );
                            $("#out").innerHTML = table(
                                "Transactions",
                                [
                                    "Code",
                                    "Date (Asia/Manila)",
                                    "Student",
                                    "Bin",
                                    "#Net weight (g)",
                                    "#Points",
                                    "Status",
                                    "Actions",
                                ],
                                r.map(
                                    (t) =>
                                        `<tr><td>${t.code}</td><td>${fmt(t.date)}</td><td>${t.stu.name}</td><td>${t.bin}</td><td class="numeric">${g(t.w)}</td><td class="numeric">${t.pts}</td><td>${pill(t.status)}</td><td class="actions-cell"><button class="btn small" data-tx="${t.code}">View</button></td></tr>`,
                                ),
                                "No transactions match your search.",
                            );
                            $("#out")
                                .querySelectorAll("[data-tx]")
                                .forEach(
                                    (b) =>
                                        (b.onclick = () => {
                                            const t = TX.find(
                                                (x) => x.code === b.dataset.tx,
                                            );
                                            dlg(
                                                `<h2 class="card-title">Transaction</h2><dl><dt>Code</dt><dd>${t.code}</dd><dt>Student</dt><dd>${t.stu.name} (${t.stu.no})</dd><dt>Organization</dt><dd>${t.stu.org}</dd><dt>Bin</dt><dd>${t.bin}</dd><dt>Net weight</dt><dd>${g(t.w)} g</dd><dt>Points</dt><dd>${t.pts} pts</dd><dt>Status</dt><dd>${t.status}</dd></dl>`,
                                            );
                                        }),
                                );
                        };
                        $("#q").oninput = d;
                        $("#st").onchange = d;
                        d();
                    },
                },
                sessions: {
                    t: "Sessions in review",
                    group: "Deposits",
                    html() {
                        return (
                            head(
                                "Sessions in review",
                                "ACCEPTED sessions older than the review threshold",
                            ) +
                            `<div class="note">An ACCEPTED session may already have the item in the bin, so it is never expired silently. <b>Open question (API_Design.md §10.1):</b> the action an admin can take on a reviewed session is not defined yet, so no action is offered.</div>` +
                            table(
                                "Sessions in review",
                                [
                                    "Session",
                                    "Student",
                                    "Bin",
                                    "#Weight (g)",
                                    "Opened at (Asia/Manila)",
                                    "Waiting",
                                    "Actions",
                                ],
                                SESSIONS.map(
                                    (s) =>
                                        `<tr><td>${s.id}</td><td>${s.stu.name}</td><td>${s.bin}</td><td class="numeric">${g(s.w)}</td><td>${s.at}</td><td>${s.wait}</td><td class="actions-cell"><span class="pill">Action TBD</span></td></tr>`,
                                ),
                                "No sessions are waiting for review.",
                            )
                        );
                    },
                },
                registrations: {
                    t: "Registration requests",
                    group: "Identity",
                    html() {
                        return (
                            head(
                                "Registration requests",
                                "Students register themselves; an admin approves or denies after checking school records",
                            ) +
                            `<div class="note">Compare the applicant's name, student number, email and organization with school records. Passwords are never shown to the reviewer.</div><div id="flash" class="flash" hidden role="status"></div><div id="out"></div>`
                        );
                    },
                    init() {
                        const d = () => {
                            $("#out").innerHTML = table(
                                "Registration requests",
                                [
                                    "Applicant",
                                    "Student number",
                                    "Email",
                                    "Organization",
                                    "Status",
                                    "Actions",
                                ],
                                REGS.map(
                                    (r) =>
                                        `<tr><td>${r.first} ${r.last}</td><td>${r.no}</td><td>${r.email}</td><td>${r.org}</td><td>${pill(r.status)}</td><td class="actions-cell"><button class="btn small${r.status === "PENDING" ? " primary" : ""}" data-r="${r.id}">${r.status === "PENDING" ? "Review" : "View"}</button></td></tr>`,
                                ),
                                "No registration requests.",
                            );
                            $("#out")
                                .querySelectorAll("[data-r]")
                                .forEach(
                                    (b) =>
                                        (b.onclick = () =>
                                            review(+b.dataset.r)),
                                );
                        };
                        const review = (id) => {
                            const r = REGS.find((x) => x.id === id);
                            const form =
                                r.status === "PENDING"
                                    ? `<form id="rf" novalidate><p class="error-text" id="re" role="alert" tabindex="-1" hidden></p><fieldset><legend>Verification against school records</legend><p>Check each detail you have verified. All four checks are needed to approve.</p><label><input type="checkbox" name="c"> Name matches school records</label><label><input type="checkbox" name="c"> Student number matches school records</label><label><input type="checkbox" name="c"> Email matches school records</label><label><input type="checkbox" name="c"> Organization matches school records</label></fieldset><label for="note" style="display:block;margin-top:16px">Review note (optional; shown to the applicant)</label><textarea id="note" class="input area"></textarea><div class="btn-row" style="margin-top:16px"><button class="btn primary" type="submit" value="APPROVED">Approve registration</button><button class="btn" type="submit" value="DENIED">Deny registration</button></div></form>`
                                    : `<p>This request is ${r.status.toLowerCase()}.</p>`;
                            dlg(
                                `<h2 class="card-title">Applicant details ${pill(r.status)}</h2><dl><dt>Name</dt><dd>${r.first} ${r.last}</dd><dt>Student number</dt><dd>${r.no}</dd><dt>Email</dt><dd>${r.email}</dd><dt>Organization</dt><dd>${r.org}</dd></dl>${form}`,
                            );
                            const f = $("#rf");
                            if (f)
                                f.onsubmit = (e) => {
                                    e.preventDefault();
                                    const dec = e.submitter.value,
                                        cs = [
                                            ...f.querySelectorAll(
                                                "input[type=checkbox]",
                                            ),
                                        ];
                                    if (
                                        dec === "APPROVED" &&
                                        cs.some((c) => !c.checked)
                                    ) {
                                        const er = $("#re");
                                        er.textContent =
                                            "Verify all four details against school records before approving.";
                                        er.hidden = false;
                                        er.focus();
                                        cs.filter((c) => !c.checked).forEach(
                                            (c) =>
                                                c.setAttribute(
                                                    "aria-invalid",
                                                    "true",
                                                ),
                                        );
                                        return;
                                    }
                                    r.status = dec;
                                    $("#dlg").close();
                                    nav();
                                    d();
                                    toast(
                                        r.first +
                                            " " +
                                            r.last +
                                            ": registration " +
                                            dec.toLowerCase() +
                                            " (sample data only).",
                                    );
                                };
                        };
                        d();
                    },
                },
                users: {
                    t: "Users",
                    group: "Identity",
                    html() {
                        return (
                            head(
                                "Users",
                                "Student accounts · activation controls only, no delete",
                            ) +
                            `<div class="toolbar"><div class="filters"><div class="field"><label for="q">Search name, number or organization</label><input id="q" type="search"></div><div class="field"><label for="st">Account</label><select id="st"><option value="">All</option><option>ACTIVE</option><option>INACTIVE</option></select></div></div></div><div id="out"></div>`
                        );
                    },
                    init() {
                        const d = () => {
                            const q = $("#q").value.toLowerCase(),
                                s = $("#st").value;

                                (u) =>
                                    (!s ||
                                        (u.active ? "ACTIVE" : "INACTIVE") ===
                                            s) &&
                                    (!q ||
                                        (u.no + u.name + u.org)
                                            .toLowerCase()
                                            .includes(q)),
                            );
                            $("#out").innerHTML = table(
                                "Users",
                                [
                                    "Student number",
                                    "Name",
                                    "Organization",
                                    "#Deposits",
                                    "#Weight (g)",
                                    "Account",
                                    "Actions",
                                ],
                                r.map((u) => {
                                    const t = completed().filter(
                                        (x) => x.stu === u,
                                    );
                                    return `<tr><td>${u.no}</td><td>${u.name}</td><td>${u.org}</td><td class="numeric">${t.length}</td><td class="numeric">${g(t.reduce((a, x) => a + x.w, 0))}</td><td>${pill(u.active ? "ACTIVE" : "INACTIVE")}</td><td class="actions-cell"><button class="btn small" data-u="${u.no}">${u.active ? "Deactivate" : "Activate"}</button></td></tr>`;
                                }),
                                "No users found.",
                            );
                            $("#out")
                                .querySelectorAll("[data-u]")
                                .forEach(
                                    (b) =>
                                        (b.onclick = () => {
                                            const u = STUDENTS.find(
                                                (x) => x.no === b.dataset.u,
                                            );
                                            u.active = !u.active;
                                            d();
                                        }),
                                );
                        };
                        $("#q").oninput = d;
                        $("#st").onchange = d;
                        d();
                    },
                },
                rewards: {
                    t: "Rewards",
                    group: "Rewards",
                    html() {
                        return (
                            head(
                                "Rewards",
                                "Items students can redeem with points",
                            ) +
                            `<div class="toolbar"><div></div><div class="btn-row"><button class="btn primary" id="add">+ Add reward</button></div></div><div id="flash" class="flash" hidden role="status"></div><div id="out"></div>`
                        );
                    },
                    init() {
                        const d = () => {
                            $("#out").innerHTML = table(
                                "Rewards",
                                [
                                    "Reward",
                                    "#Points cost",
                                    "#Stock",
                                    "Availability",
                                    "Actions",
                                ],
                                REWARDS.map(
                                    (r, i) =>
                                        `<tr><td>${r.name}</td><td class="numeric">${r.pts}</td><td class="numeric">${r.stock}</td><td>${pill(r.on && r.stock > 0 ? "ACTIVE" : "INACTIVE")}${r.stock === 0 ? " Out of stock" : ""}</td><td class="actions-cell"><button class="btn small" data-t="${i}">${r.on ? "Deactivate" : "Activate"}</button></td></tr>`,
                                ),
                            );
                            $("#out")
                                .querySelectorAll("[data-t]")
                                .forEach(
                                    (b) =>
                                        (b.onclick = () => {
                                            REWARDS[b.dataset.t].on =
                                                !REWARDS[b.dataset.t].on;
                                            d();
                                        }),
                                );
                        };
                        d();
                        $("#add").onclick = () => {
                            dlg(
                                `<h2 class="card-title">Add reward</h2><form class="inline-form" id="f" novalidate><div class="field"><label for="n">Reward name (required)</label><input id="n"></div><div class="field"><label for="p">Points cost (required)</label><input id="p" type="number" min="1"></div><div class="field"><label for="s">Stock (required)</label><input id="s" type="number" min="0" value="10"></div><p class="error-text" id="e" role="alert"></p><div class="btn-row"><button class="btn primary" type="submit">Save reward</button><button class="btn" type="button" data-close>Cancel</button></div></form>`,
                            );
                            $("#f").onsubmit = (e) => {
                                e.preventDefault();
                                const n = $("#n").value.trim(),
                                    p = +$("#p").value,
                                    s = +$("#s").value;
                                if (!n || !(p >= 1) || !(s >= 0)) {
                                    $("#e").textContent =
                                        "Enter a name, a points cost of at least 1, and a stock of 0 or more.";
                                    return;
                                }
                                REWARDS.push({
                                    name: n,
                                    pts: p,
                                    stock: s,
                                    on: true,
                                });
                                $("#dlg").close();
                                d();
                                toast("Reward saved (sample data only).");
                            };
                        };
                    },
                },
                redemptions: {
                    t: "Redemptions",
                    group: "Rewards",
                    html() {
                        return (
                            head(
                                "Redemptions",
                                "Review student requests, then record the outcome",
                            ) +
                            `<div id="flash" class="flash" hidden role="status"></div><div id="out"></div>`
                        );
                    },
                    init() {
                        const d = () => {
                            $("#out").innerHTML = table(
                                "Redemptions",
                                [
                                    "Request",
                                    "Date",
                                    "Student",
                                    "Reward",
                                    "#Points",
                                    "Status",
                                    "Actions",
                                ],
                                REDS.map(
                                    (r) =>
                                        `<tr><td>${r.id}</td><td>${r.date}</td><td>${r.stu.name}</td><td>${r.reward}</td><td class="numeric">${r.pts}</td><td>${pill(r.status)}</td><td class="actions-cell">${r.status === "PENDING" ? `<button class="btn primary small" data-f="${r.id}">Mark fulfilled</button> <button class="btn small" style="color:var(--danger);border-color:var(--danger)" data-c="${r.id}">Cancel request</button>` : "—"}</td></tr>`,
                                ),
                            );
                            const set = (id, s) => {
                                REDS.find((x) => x.id === id).status = s;
                                nav();
                                d();
                                toast(
                                    id +
                                        " marked " +
                                        s.toLowerCase() +
                                        " (sample data only).",
                                );
                            };
                            $("#out")
                                .querySelectorAll("[data-f]")
                                .forEach(
                                    (b) =>
                                        (b.onclick = () =>
                                            set(b.dataset.f, "FULFILLED")),
                                );
                            $("#out")
                                .querySelectorAll("[data-c]")
                                .forEach(
                                    (b) =>
                                        (b.onclick = () =>
                                            set(b.dataset.c, "CANCELLED")),
                                );
                        };
                        d();
                    },
                },
            };
            /* ---------- shell ---------- */
            function dlg(h) {
                const d = $("#dlg");
                d.innerHTML =
                    h +
                    `<div class="btn-row" style="margin-top:16px"><button class="btn" data-close>Close</button></div>`;
                d.querySelectorAll("[data-close]").forEach(
                    (b) => (b.onclick = () => d.close()),
                );
                d.showModal();
            }
            let cur = "dashboard";
            function nav() {
                let last = "",
                    h = "";
                for (const [k, s] of Object.entries(SCREENS)) {
                    if (s.group !== last) {
                        h += `<div class="wf-nav-group">${s.group}</div>`;
                        last = s.group;
                    }
                    const n =
                        k === "redemptions"
                            ? REDS.filter((r) => r.status === "PENDING").length
                            : k === "registrations"
                              ? REGS.filter((r) => r.status === "PENDING")
                                    .length
                              : k === "sessions"
                                ? SESSIONS.length
                                : 0;
                    h += `<button class="wf-nav${k === cur ? " active" : ""}" data-s="${k}"${k === cur ? ' aria-current="page"' : ""}>${s.t}${n ? ` <span class="badge">${n}</span>` : ""}</button>`;
                }
                $("#nav").innerHTML = h;
                $("#nav")
                    .querySelectorAll("[data-s]")
                    .forEach((b) => (b.onclick = () => go(b.dataset.s)));
            }
            function go(k) {
                cur = k;
                const s = SCREENS[k];
                $("#crumb").textContent = s.t;
                $("#admin-content").innerHTML =
                    `<section class="screen active">${s.html()}</section>`;
                nav();
                s.init && s.init();
                $("#admin-content")
                    .querySelectorAll("[data-go]")
                    .forEach((b) => (b.onclick = () => go(b.dataset.go)));
                if (innerWidth < 1024) $("#admin-navigation").open = false;
                const h = $("#admin-content h1");
                h && h.focus({ preventScroll: true });
            }
            $("#admin-navigation").open = innerWidth >= 1024;
            go("dashboard");
        </script>
    </body>
</html>
