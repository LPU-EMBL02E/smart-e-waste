<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#20252b;background:#f6f7f8;--line:#d9dfe4;--muted:#64717c;--panel:#fff;--soft:#f5f7f8;--ink:#20252b;--accent:#334e5d;--radius:12px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8faec5;outline-offset:2px}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}.eyebrow{text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-size:11px;font-weight:800}.app{display:flex;min-height:100vh}.sidebar{width:254px;background:#fff;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;z-index:30}.sidebar.collapsed{width:76px}.brand{padding:23px 18px 21px;display:flex;gap:11px;align-items:center;border-bottom:1px solid var(--line)}.brand-icon{width:37px;height:37px;background:#e6ecef;border:1px solid #b7c3ca;border-radius:10px;display:grid;place-items:center;font-weight:900;color:#334e5d;flex-shrink:0}.brand strong{display:block;font-size:14px}.brand small{display:block;font-size:10px;color:var(--muted);margin-top:4px}.nav{padding:18px 11px;overflow:auto;flex:1}.nav-group{margin:0 12px 9px;color:#89949c;font-size:10px;font-weight:800;letter-spacing:.12em}.nav button,.logout{display:flex;align-items:center;gap:14px;width:100%;padding:11px 13px;border:0;background:transparent;text-align:left;color:#596671;border-radius:9px;font-size:13px;margin-bottom:3px;white-space:nowrap}.nav button.active{background:#eaf0f3;color:#243f4e;font-weight:750}.nav button:hover,.logout:hover{background:#f1f3f5}.nav .symbol{font-size:18px;width:23px;display:inline-block;text-align:center;flex-shrink:0}.side-bottom{padding:12px;border-top:1px solid var(--line)}.sidebar.collapsed .label,.sidebar.collapsed .nav-group,.sidebar.collapsed .brand-copy{display:none}.sidebar.collapsed .nav button,.sidebar.collapsed .logout{justify-content:center;padding:12px}.main-shell{min-width:0;flex:1}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;gap:15px;position:sticky;top:0;z-index:20}.top-left,.top-right{display:flex;align-items:center;gap:14px}.iconbtn{border:1px solid var(--line);background:#fff;border-radius:9px;min-width:38px;height:38px;color:#455561;font-size:19px}.iconbtn:hover{background:#f2f4f5}.top-title{font-weight:760;font-size:14px}.avatar{width:34px;height:34px;background:#e8edef;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:750}.user-mini strong{font-size:12px;display:block}.user-mini small{font-size:10px;color:var(--muted)}.content{max-width:1420px;padding:34px;margin:0 auto}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:25px}.heading h1{font-size:26px;letter-spacing:-.8px;margin:5px 0 7px}.heading p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}.chip{background:#eef2f3;border:1px solid var(--line);padding:7px 10px;border-radius:7px;color:#51616b;font-size:11px;white-space:nowrap}.grid{display:grid;gap:17px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);min-width:0}.card-pad{padding:21px}.stat-label{font-size:12px;color:var(--muted);font-weight:650}.stat-num{font-size:29px;font-weight:800;margin:12px 0 5px;letter-spacing:-1px}.stat-foot{font-size:11px;color:#70818c}.stat-top{display:flex;align-items:center;justify-content:space-between}.stat-icon{background:#eff2f3;padding:7px;border-radius:8px;color:#516674}.cols{grid-template-columns:minmax(0,1.8fr) minmax(290px,1fr)}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.section-title h2{margin:0;font-size:16px;letter-spacing:-.3px}.linkbtn{border:0;background:none;color:#36596d;font-weight:750;font-size:12px;padding:4px 0}.linkbtn:hover{text-decoration:underline}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px;text-align:left}th{color:#77848d;background:#f8f9fa;font-size:10px;text-transform:uppercase;letter-spacing:.04em;font-weight:750}th,td{padding:14px 13px;border-bottom:1px solid #e9ecef;white-space:nowrap}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#fafbfb}.tag{display:inline-flex;padding:5px 8px;font-size:10px;border-radius:6px;background:#eef2f3;color:#47616e;border:1px solid #dce5e9}.tag.warn{background:#fcf5e5;color:#916c2e;border-color:#efe0ba}.tag.danger{background:#fae9e9;color:#a64a4a;border-color:#eccaca}.divider{height:1px;background:var(--line);margin:17px 0}.activity{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #edf0f2}.activity:last-child{border:0}.activity-ic{background:#edf2f4;border:1px solid #e0e7ea;border-radius:9px;width:33px;height:33px;display:grid;place-items:center;flex-shrink:0}.activity strong{font-size:12px;display:block;margin-bottom:4px}.activity p{font-size:11px;color:var(--muted);margin:0;line-height:1.5}.reward-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.reward-thumb{background:#f0f2f3;height:128px;border-radius:9px;display:grid;place-items:center;font-size:44px;color:#a0aab0;border:1px dashed #cbd4d8;margin-bottom:14px}.reward-card h3{font-size:14px;margin:0 0 7px}.reward-card p{font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 15px}.between{display:flex;align-items:center;justify-content:space-between;gap:8px}.btn{border:1px solid #b8c5cc;border-radius:8px;padding:10px 15px;background:#fff;color:#314b5a;font-size:12px;font-weight:750}.btn.primary{background:#334e5d;color:white;border-color:#334e5d}.btn:hover{filter:brightness(.96)}.btn:disabled{opacity:.5;cursor:not-allowed}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.field label{display:block;font-size:11px;color:#56646d;font-weight:700;margin-bottom:7px}.field input,.field select{width:100%;padding:12px;background:white;border:1px solid #d3dce1;border-radius:8px;color:#2a3941;font-size:13px}.field input[readonly]{background:#f7f8f8;color:#66747b}.banner{border:1px solid #d5e0e5;background:#f0f5f7;padding:15px 17px;border-radius:9px;color:#465b68;font-size:12px;line-height:1.6}.progress{height:8px;border-radius:20px;background:#e8edf0;overflow:hidden}.progress div{height:100%;background:#7d9dac;border-radius:20px}.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:17px}.search{border:1px solid var(--line);border-radius:8px;padding:11px 13px;background:white;min-width:180px;flex:1;font-size:12px}.filterselect{border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px;font-size:12px}.empty{text-align:center;padding:38px 18px;color:#7c8991;font-size:12px}.empty .icon{font-size:32px;margin-bottom:10px}.rank-list{width:100%}.rank-row{display:grid;grid-template-columns:55px 1fr auto;gap:12px;align-items:center;border-bottom:1px solid #e9ecee;padding:16px 5px;font-size:12px}.rank-row:last-child{border-bottom:0}.rank-row.you{background:#eff4f6;border-radius:8px;padding:16px 12px;border:1px solid #d6e4e9}.rank-n{font-weight:800;font-size:15px;color:#647a86}.notification{display:flex;gap:13px;border-bottom:1px solid var(--line);padding:17px 0}.notification:last-child{border:0}.notification.unread{background:#f6f9fa}.notification h3{font-size:13px;margin:0 0 5px}.notification p{font-size:12px;color:var(--muted);line-height:1.55;margin:0 0 7px}.modal-bg{position:fixed;inset:0;background:#14222cb0;display:grid;place-items:center;z-index:100;padding:20px}.modal{background:#fff;border-radius:15px;max-width:460px;width:100%;padding:25px;box-shadow:0 20px 70px #0003}.modal h2{margin:0 0 8px;font-size:20px}.modal p{font-size:13px;line-height:1.6;color:#62717b}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:21px}.toast{position:fixed;bottom:24px;right:24px;background:#253e4a;color:#fff;padding:13px 18px;border-radius:9px;box-shadow:0 8px 30px #0002;font-size:12px;z-index:200;max-width:320px}.login-page{min-height:100vh;display:grid;place-items:center;background:#f4f6f7;padding:24px}.login-card{width:min(100%,420px);padding:35px;background:#fff;border:1px solid #dce3e7;border-radius:16px}.login-card h1{font-size:23px;margin:25px 0 8px}.login-card p{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 26px}.login-card .field{margin-bottom:18px}.login-card .btn{width:100%;margin-top:7px;padding:13px}.login-error{color:#ac4949;font-size:12px;margin-bottom:12px}.overlay{display:none}.footnote{margin-top:27px;color:#95a0a8;font-size:11px}.mock-label{font-size:10px;border-radius:6px;padding:6px 8px;color:#647785;background:#f0f3f5;border:1px solid #dce4e7}.two-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.notice-dot{height:8px;width:8px;background:#849eac;display:inline-block;border-radius:50%}.right{text-align:right}.stack{display:grid;gap:16px}@media(max-width:1150px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.reward-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:26px}}@media(max-width:850px){.sidebar{position:fixed;left:0;transform:translateX(-101%);box-shadow:10px 0 30px #0001}.sidebar.mobile-open{transform:translateX(0)}.sidebar.collapsed{width:254px}.sidebar.collapsed .label,.sidebar.collapsed .nav-group,.sidebar.collapsed .brand-copy{display:block}.overlay.visible{display:block;position:fixed;inset:0;background:#0006;z-index:25}.cols{grid-template-columns:1fr}.topbar{padding:0 20px}.content{padding:22px 18px}.reward-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.stats,.reward-grid,.form-grid{grid-template-columns:1fr}.heading{flex-direction:column}.topbar .user-mini{display:none}.content{padding:20px 13px}.card-pad{padding:17px}.stat-num{font-size:27px}.heading h1{font-size:23px}.topbar{height:62px}.chip{white-space:normal}}body.dark{--line:#344047;--muted:#a6b4bd;--panel:#202a31;--soft:#23323c;--ink:#f3f6f7;background:#172127;color:#e9f0f3}body.dark .card,body.dark .topbar,body.dark .sidebar,body.dark .login-card,body.dark .modal{background:#202a31;color:#ecf3f5}body.dark .nav button,body.dark .logout{color:#c4d0d6}body.dark .nav button.active{background:#354754;color:white}body.dark .iconbtn,body.dark .btn:not(.primary),body.dark .search,body.dark .filterselect,body.dark .field input,body.dark .field select{background:#26333b;color:#eaf1f5;border-color:#43525d}body.dark th,body.dark tbody tr:hover{background:#26333b}body.dark td{border-color:#34434c}body.dark .tag,body.dark .stat-icon{background:#32424c;color:#d9e5ea}body.dark .notification.unread,body.dark .rank-row.you,body.dark .banner{background:#283a45}body.dark .reward-thumb{background:#293942}body.dark .login-page{background:#172127}

/* Outlined notification bell inspired by the provided reference */
.notification-bell{position:relative;display:inline-flex;align-items:center;justify-content:center;width:29px;height:31px;vertical-align:middle;flex-shrink:0}
.notification-bell svg{width:29px;height:29px;display:block;fill:none;stroke:#414141;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.notification-bell .bell-badge{position:absolute;right:-8px;top:-5px;display:flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 3px;border-radius:999px;background:#e52f3b;color:#fff;border:2px solid #fff;font-size:10px;font-weight:800;line-height:1;box-sizing:content-box}
.notification-bell.sidebar-bell{width:23px;height:24px}
.notification-bell.sidebar-bell svg{width:23px;height:23px}
.notification-bell.sidebar-bell .bell-badge{right:-7px;top:-5px;min-width:13px;height:13px;font-size:8px;border-width:1px}
.iconbtn.bell-button{display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:42px;padding:4px 10px;overflow:visible}
body.dark .notification-bell svg{stroke:#e7ecf0}

<body>
<div id="root"></div>
<script>
const initialTransactions=[{id:'EW-2026-0018',date:'Sep 28, 2026',item:'Small electronics',weight:0.85,points:85,status:'Completed'},{id:'EW-2026-0017',date:'Sep 23, 2026',item:'Electronic accessories',weight:0.45,points:45,status:'Completed'},{id:'EW-2026-0016',date:'Sep 18, 2026',item:'Small electronics',weight:1.20,points:120,status:'Completed'},{id:'EW-2026-0015',date:'Sep 10, 2026',item:'Electronic accessories',weight:0.60,points:60,status:'Completed'}];
const rewardOptions=[{id:1,name:'Campus Meal Voucher',cost:120,stock:5,icon:'▤',desc:'Sample student meal voucher reward.'},{id:2,name:'School Supplies Pack',cost:250,stock:3,icon:'✎',desc:'Notebook and basic school supplies.'},{id:3,name:'Reusable Tumbler',cost:400,stock:2,icon:'◯',desc:'Reusable drink container reward.'},{id:4,name:'Campus Merchandise',cost:650,stock:0,icon:'♧',desc:'Limited student merchandise.'},{id:5,name:'Printing Credit',cost:90,stock:8,icon:'▣',desc:'Sample printing service credit.'},{id:6,name:'Eco Tote Bag',cost:300,stock:4,icon:'▱',desc:'Reusable tote bag reward.'}];
let state={loggedIn:false,page:'dashboard',collapsed:false,mobile:false,dark:false,balance:710,transactions:initialTransactions.map(x=>({...x})),rewards:rewardOptions.map(x=>({...x})),redemptions:[],notifications:[{id:1,title:'Points updated',message:'Your recent disposal transaction has been added to your account.',date:'Sep 28, 2026',read:false},{id:2,title:'Transaction recorded',message:'Transaction EW-2026-0018 is available in your history.',date:'Sep 28, 2026',read:false},{id:3,title:'Welcome to the student portal',message:'Browse rewards and view your transaction history.',date:'Sep 02, 2026',read:true}],selectedTx:null,selectedReward:null,search:'',historyFilter:'all',loginError:'',rewardFilter:'all'};
const titles={dashboard:'Dashboard Home',profile:'My Profile',points:'Current Points',history:'Disposal History',organization:'Organization Information',leaderboard:'Leaderboard',rewards:'Available Rewards',redemption:'Reward Redemption',notifications:'Notifications',settings:'Settings',details:'Transaction Details'};
const icons={dashboard:'▦',profile:'♙',points:'◉',history:'▤',organization:'♧',leaderboard:'▥',rewards:'◇',redemption:'⇄',notifications:'♢',settings:'⚙'};
function bellIcon(count=0,sidebar=false){return `<span class="notification-bell ${sidebar?'sidebar-bell':''}" aria-hidden="true"><svg viewBox="0 0 30 32" xmlns="http://www.w3.org/2000/svg"><path d="M13 4V2.5a2 2 0 0 1 4 0V4"/><path d="M15 4c-6 0-9.2 4.7-9.2 10.5V21c0 1.7-1.5 3.5-3.1 4.5-.8.6-.4 1.8.6 1.8h23.4c1 0 1.4-1.2.6-1.8-1.6-1-3.1-2.8-3.1-4.5v-6.5C24.2 8.7 21 4 15 4Z"/><path d="M11 28c.3 2.2 1.7 3.1 4 3.1s3.7-.9 4-3.1"/></svg>${count>0?`<span class="bell-badge">${count>99?'99+':count}</span>`:''}</span>`}
const root=document.getElementById('root');const $=id=>document.getElementById(id);const money=n=>Number(n).toLocaleString('en-US');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notify(msg){let el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),3500)}
function go(page){state.page=page;state.mobile=false;state.search='';state.historyFilter='all';render();window.scrollTo(0,0)}
function title(sub,description,action=''){return `<div class="heading"><div><div class="eyebrow">STUDENT WEB PORTAL / ${esc(sub)}</div><h1>${esc(sub)}</h1><p>${description}</p></div>${action}</div>`}
function card(body,cls=''){return `<div class="card card-pad ${cls}">${body}</div>`}
function secTitle(t,action=''){return `<div class="section-title"><h2>${t}</h2>${action}</div>`}
function stat(name,num,foot,ico){return `<div class="card card-pad"><div class="stat-top"><span class="stat-label">${name}</span><span class="stat-icon">${ico}</span></div><div class="stat-num">${num}</div><div class="stat-foot">${foot}</div></div>`}
function txTable(txs){if(!txs.length)return `<div class="empty"><div class="icon">▤</div>No transactions found for this filter.</div>`;return `<div class="table-wrap"><table><thead><tr><th>Transaction ID</th><th>Date</th><th>E-waste Category</th><th>Weight</th><th>Points Earned</th><th>Status</th><th></th></tr></thead><tbody>${txs.map(t=>`<tr><td><strong>${t.id}</strong></td><td>${t.date}</td><td>${t.item}</td><td>${t.weight.toFixed(2)} kg</td><td>+${t.points}</td><td><span class="tag">${t.status}</span></td><td><button class="linkbtn" data-tx="${t.id}">Details →</button></td></tr>`).join('')}</tbody></table></div>`}
function dashboard(){let total=state.transactions.reduce((a,t)=>a+t.weight,0);return title('Dashboard Home','An overview of your e-waste contributions and reward activity.','<span class="chip">Wireframe · Mock data</span>')+`<div class="grid stats">${stat('Available Points',money(state.balance),'Redeemable rewards balance','◉')}${stat('Successful Deposits',state.transactions.length,'Recorded transactions','▤')}${stat('Total Collected Weight',total.toFixed(2)+' kg','Across your transactions','▱')}${stat('Your Leaderboard Rank','#4','Sample student standings','▥')}</div><div class="grid cols">${card(secTitle('Recent Transactions','<button class="linkbtn" data-go="history">View all →</button>')+txTable(state.transactions.slice(0,4))) }<div class="stack">${card(secTitle('Recent Notifications','<button class="linkbtn" data-go="notifications">View all →</button>')+state.notifications.slice(0,3).map(n=>`<div class="activity"><div class="activity-ic">◈</div><div><strong>${esc(n.title)}</strong><p>${esc(n.message)} · ${n.date}</p></div></div>`).join(''))}${card(secTitle('Rewards Preview','<button class="linkbtn" data-go="rewards">Browse rewards →</button>')+`<div class="between"><div><div class="muted small">Next affordable reward</div><h3 style="margin:8px 0">Printing Credit</h3><div class="small muted">90 points required</div></div><div style="font-size:35px;color:#9caeb8">◇</div></div><div class="divider"></div><button class="btn primary" data-go="rewards">Explore Rewards →</button>`)}</div></div><div class="footnote">Prototype note: All balances, names, items and leaderboard entries are illustrative mock data, not live records.</div>`}
function profile(){return title('My Profile','Student account information displayed in read-only form.')+card(secTitle('Student Information')+`<div class="form-grid">${[['Full Name','Alex Student'],['Student ID','2026-00018'],['Email Address','alex.student@example.edu'],['Organization','College of Engineering'],['Account Type','Student'],['Account Status','Active']].map(([l,v])=>`<div class="field"><label>${l}</label><input value="${v}" readonly></div>`).join('')}</div><div class="divider"></div><div class="banner">Profile information is illustrative. The report requires a student profile page; actual editable fields depend on the approved account design.</div>`)}
function points(){const earned=state.transactions.reduce((a,t)=>a+t.points,0);const spent=state.redemptions.reduce((a,r)=>a+r.cost,0);return title('Current Points','Track your reward balance and activity.')+`<div class="grid stats">${stat('Available Balance',money(state.balance),'Points you can redeem','◉')}${stat('Sample Earned Points',money(earned),'From shown transactions','＋')}${stat('Redeemed This Session',money(spent),'Prototype redemptions','↗')}${stat('Recorded Deposits',state.transactions.length,'Transaction count','▤')}</div>${card(secTitle('Reward Point Information')+`<p class="muted" style="font-size:13px;line-height:1.7">Your balance is updated in this prototype when you redeem a reward. The official point conversion and calculation rules must follow the approved project system; no conversion formula is implemented here.</p><div class="divider"></div><div class="between"><strong>Reward Balance</strong><strong>${money(state.balance)} points</strong></div><div class="progress" style="margin:14px 0"><div style="width:${Math.min(100,100*state.balance/1000)}%"></div></div><p class="small muted">Illustrative progress toward a 1,000-point target (optional enhancement).</p><button class="btn primary" data-go="rewards">Browse Rewards</button>`)}`}
function history(){let tx=state.transactions.filter(t=>(state.historyFilter==='all'||t.status.toLowerCase()===state.historyFilter)&&(`${t.id} ${t.item} ${t.date}`.toLowerCase().includes(state.search.toLowerCase())));return title('Disposal History','View and search your recorded e-waste contributions.')+card(secTitle('Transaction Records',`<span class="chip">${tx.length} results</span>`)+`<div class="filters"><input class="search" id="historySearch" placeholder="Search transaction ID, item or date" value="${esc(state.search)}" aria-label="Search transactions"><select class="filterselect" id="historyFilter"><option value="all">All statuses</option><option value="completed">Completed</option><option value="failed">Failed</option></select></div><div id="historyResults">${txTable(tx)}</div>`)}
function details(){let t=state.transactions.find(x=>x.id===state.selectedTx);if(!t)return history();return title('Transaction Details','Details for a selected disposal record.',`<button class="btn" data-go="history">← Back to history</button>`)+card(secTitle('Transaction '+t.id)+`<div class="form-grid">${[['Transaction Reference',t.id],['Date',t.date],['Category',t.item],['Recorded Weight',t.weight.toFixed(2)+' kg'],['Points Earned','+'+t.points],['Transaction Status',t.status]].map(([l,v])=>`<div class="field"><label>${l}</label><input value="${v}" readonly></div>`).join('')}</div>`)}
function organization(){return title('Organization Information','View the organization associated with your student account.')+card(secTitle('Organization Profile')+`<div class="form-grid">${[['Organization','College of Engineering'],['Organization Type','Academic College'],['Student Affiliation','Member'],['Community Activity','E-waste participation program']].map(([l,v])=>`<div class="field"><label>${l}</label><input value="${v}" readonly></div>`).join('')}</div><div class="divider"></div><div class="banner">The source report requires organization information, but does not specify exact institutional fields. The text shown here is placeholder content.</div>`)}
function leaderboard(){const people=[['1','Taylor Lee','1,500'],['2','Jordan Cruz','1,230'],['3','Sam Rivera','980'],['4','Alex Student',String(state.balance)],['5','Casey Lim','650'],['6','Morgan Reyes','500']];return title('Leaderboard','Illustrative student standings based on sample reward points.')+card(secTitle('Student Rankings','<span class="chip">Demo rankings</span>')+`<div class="rank-list">${people.map(([r,n,p])=>`<div class="rank-row ${n==='Alex Student'?'you':''}"><span class="rank-n">#${r}</span><strong>${n}${n==='Alex Student'?' (You)':''}</strong><strong>${money(p)} pts</strong></div>`).join('')}</div><div class="divider"></div><p class="small muted">The report requires a leaderboard but does not define a final ranking formula. Positions above are static examples and do not recalculate after redemption.</p>`)}
function rewards(){const list=state.rewards.filter(r=>state.rewardFilter==='all'||(state.rewardFilter==='available'?r.stock>0:r.cost<=state.balance));return title('Available Rewards','Browse sample rewards and use your available points.','<span class="chip">Mock catalog</span>')+`<div class="between" style="margin-bottom:18px">${card(`<span class="muted small">Your points</span><div style="font-size:24px;font-weight:800;margin-top:5px">${money(state.balance)} pts</div>`)}<select class="filterselect" id="rewardFilter"><option value="all">All rewards</option><option value="available">In stock</option><option value="affordable">Within my points</option></select></div><div class="reward-grid">${list.map(r=>card(`<div class="reward-thumb">${r.icon}</div><h3>${r.name}</h3><p>${r.desc}</p><div class="between" style="margin-bottom:17px"><strong style="font-size:13px">${r.cost} points</strong><span class="tag ${r.stock===0?'warn':''}">${r.stock>0?r.stock+' available':'Unavailable'}</span></div><button class="btn ${state.balance>=r.cost&&r.stock>0?'primary':''}" style="width:100%" data-reward="${r.id}" ${r.stock===0?'disabled':''}>${r.stock===0?'Not Available':state.balance<r.cost?'View Requirement':'Redeem Reward'}</button>`,'reward-card')).join('')}</div>${!list.length?card('<div class="empty">No rewards match the selected filter.</div>'):''}`}
function redemption(){return title('Reward Redemption','Review mock redemption activity. Actual fulfillment is not connected.')+`<div class="grid cols">${card(secTitle('Your Redemption History')+(state.redemptions.length?`<div class="table-wrap"><table><thead><tr><th>Reward</th><th>Points</th><th>Status</th></tr></thead><tbody>${state.redemptions.map(r=>`<tr><td>${r.name}</td><td>-${r.cost}</td><td><span class="tag">Demo confirmed</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><div class="icon">◇</div>No rewards redeemed in this demo session yet.</div>'))}${card(secTitle('Available Points')+`<div class="stat-num">${money(state.balance)}</div><p class="muted small">Choose a reward from the catalog, review its required points, and confirm your redemption.</p><button class="btn primary" data-go="rewards">Open Rewards Catalog</button>`)}</div>`}
function notifications(){return title('Notifications','Read your transaction and reward messages.',`<button class="btn" id="markAll">Mark all as read</button>`)+card(secTitle('Student Notifications')+state.notifications.map(n=>`<div class="notification ${n.read?'':'unread'}"><div class="activity-ic">${n.read?'✓':'•'}</div><div style="flex:1"><h3>${esc(n.title)} ${n.read?'':'<span class="notice-dot"></span>'}</h3><p>${esc(n.message)}</p><span class="small muted">${n.date}</span></div>${!n.read?`<button class="linkbtn" data-read="${n.id}">Mark read</button>`:''}</div>`).join(''))}
function settings(){return title('Settings','Manage basic interface preferences for this demo.')+`<div class="grid cols">${card(secTitle('Appearance')+`<div class="field"><label>Theme</label><select id="themeSelect"><option value="light">Light mode</option><option value="dark">Dark mode</option></select></div><div class="divider"></div><p class="small muted">Theme changes apply only during this open prototype session.</p>`)}${card(secTitle('Session')+`<p class="muted small" style="line-height:1.7">This mock login has no real authentication. Logging out returns you to the demo sign-in page.</p><button class="btn" id="settingsLogout">Log Out</button>`)}</div>`}
function login(){root.innerHTML=`<div class="login-page"><div class="login-card"><div class="brand-icon">EW</div><h1>Student Web Portal</h1><p>Sign in to view points, transaction history, rankings, rewards, and notifications.</p>${state.loginError?`<div class="login-error">${esc(state.loginError)}</div>`:''}<form id="loginForm"><div class="field"><label>Student ID</label><input name="studentId" placeholder="e.g. 2026-00018" autocomplete="username" required></div><div class="field"><label>Password</label><input type="password" name="password" placeholder="Enter any demo password" autocomplete="current-password" required></div><button type="submit" class="btn primary">Sign In →</button></form><div class="divider"></div><div class="banner"><strong>Demo access</strong><br>Student ID: <strong>2026-00018</strong><br>Password: <strong>demo123</strong><br><span class="small">No server or user records are connected.</span></div></div></div>`;$('loginForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);if(f.get('studentId')==='2026-00018'&&f.get('password')==='demo123'){state.loggedIn=true;state.loginError='';go('dashboard')}else{state.loginError='Invalid demo credentials. Use the values shown below.';login()}}}
function sidebar(){return `<aside class="sidebar ${state.collapsed?'collapsed':''} ${state.mobile?'mobile-open':''}" id="sidebar"><div class="brand"><div class="brand-icon">EW</div><div class="brand-copy"><strong>EMBL02E</strong><small>STUDENT WEB PORTAL</small></div></div><div class="nav"><div class="nav-group">MAIN NAVIGATION</div>${['dashboard','profile','points','history','organization','leaderboard','rewards','redemption','notifications','settings'].map(p=>`<button class="${state.page===p?'active':''}" data-go="${p}" title="${titles[p]}"><span class="symbol">${p==='notifications'?bellIcon(state.notifications.filter(n=>!n.read).length,true):icons[p]}</span><span class="label">${titles[p]}</span></button>`).join('')}</div><div class="side-bottom"><button class="logout" id="logout"><span class="symbol">↪</span><span class="label">Logout</span></button></div></aside>`}
function app(){let unread=state.notifications.filter(n=>!n.read).length;let view=({dashboard,profile,points,history,organization,leaderboard,rewards,redemption,notifications,settings,details}[state.page]||dashboard)();root.innerHTML=`<div class="app">${sidebar()}<div class="overlay ${state.mobile?'visible':''}" id="overlay"></div><div class="main-shell"><header class="topbar"><div class="top-left"><button class="iconbtn" id="menuToggle" aria-label="Toggle navigation">☰</button><span class="top-title">${titles[state.page]}</span></div><div class="top-right"><span class="mock-label">LOW-FIDELITY PROTOTYPE</span><button class="iconbtn bell-button" id="topNotify" aria-label="Notifications${unread?` (${unread} unread)`:``}" title="Notifications">${bellIcon(unread)}</button><div class="avatar">AS</div><div class="user-mini"><strong>Alex Student</strong><small>Student Account</small></div></div></header><main class="content">${view}</main></div></div><div id="modalHost"></div>`;bind();}
function render(){document.body.classList.toggle('dark',state.dark);state.loggedIn?app():login()}
function confirmReward(id){let r=state.rewards.find(x=>x.id===id);if(!r)return;let enough=state.balance>=r.cost;let host=$('modalHost');host.innerHTML=`<div class="modal-bg" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="Reward confirmation"><div class="eyebrow">REWARD REDEMPTION</div><h2 style="margin-top:9px">${r.name}</h2><p>${r.desc}</p><div class="divider"></div><div class="between"><span class="muted small">Required points</span><strong>${r.cost}</strong></div><div class="between" style="margin-top:12px"><span class="muted small">Your points</span><strong>${state.balance}</strong></div><div class="between" style="margin-top:12px"><span class="muted small">Balance after redemption</span><strong>${enough?state.balance-r.cost:'Not enough points'}</strong></div>${!enough?'<p style="color:#a64a4a">Insufficient points to redeem this reward.</p>':'<p>This is a prototype. Confirming changes only the displayed demo points and inventory.</p>'}<div class="modal-actions"><button class="btn" id="cancelModal">Cancel</button><button class="btn primary" id="confirmModal" ${!enough||r.stock<1?'disabled':''}>Confirm Redemption</button></div></div></div>`;$('cancelModal').onclick=()=>host.innerHTML='';$('modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')host.innerHTML=''};$('confirmModal').onclick=()=>{if(state.balance<r.cost||r.stock<=0)return;state.balance-=r.cost;r.stock--;state.redemptions.unshift({name:r.name,cost:r.cost});state.notifications.unshift({id:Date.now(),title:'Reward redemption successful',message:`You redeemed ${r.name} for ${r.cost} points (demo only).`,date:'Just now',read:false});state.page='redemption';render();notify('Reward redeemed successfully (demo).')}}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-tx]').forEach(b=>b.onclick=()=>{state.selectedTx=b.dataset.tx;go('details')});document.querySelectorAll('[data-reward]').forEach(b=>b.onclick=()=>confirmReward(Number(b.dataset.reward)));document.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>{let n=state.notifications.find(n=>n.id===Number(b.dataset.read));if(n)n.read=true;render()});if($('markAll'))$('markAll').onclick=()=>{state.notifications.forEach(n=>n.read=true);render();notify('All notifications marked as read.')};if($('topNotify'))$('topNotify').onclick=()=>go('notifications');if($('menuToggle'))$('menuToggle').onclick=()=>{if(window.innerWidth<=850)state.mobile=!state.mobile;else state.collapsed=!state.collapsed;render()};if($('overlay'))$('overlay').onclick=()=>{state.mobile=false;render()};if($('logout'))$('logout').onclick=logout;if($('settingsLogout'))$('settingsLogout').onclick=logout;if($('historySearch'))$('historySearch').oninput=e=>{let sel=e.target.selectionStart;state.search=e.target.value;let t=state.transactions.filter(x=>(state.historyFilter==='all'||x.status.toLowerCase()===state.historyFilter)&&(`${x.id} ${x.item} ${x.date}`.toLowerCase().includes(state.search.toLowerCase())));$('historyResults').innerHTML=txTable(t);document.querySelectorAll('[data-tx]').forEach(b=>b.onclick=()=>{state.selectedTx=b.dataset.tx;go('details')})};if($('historyFilter')){$('historyFilter').value=state.historyFilter;$('historyFilter').onchange=e=>{state.historyFilter=e.target.value;render()}}if($('rewardFilter')){$('rewardFilter').value=state.rewardFilter;$('rewardFilter').onchange=e=>{state.rewardFilter=e.target.value;render()}}if($('themeSelect')){$('themeSelect').value=state.dark?'dark':'light';$('themeSelect').onchange=e=>{state.dark=e.target.value==='dark';render()}}}
function logout(){state.loggedIn=false;state.page='dashboard';state.mobile=false;render();notify('You have logged out of the demo.')}
render();
</script>
</body>
</html>
