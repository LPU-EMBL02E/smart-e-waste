<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" href="data:," />
        <title>EMBL02E | Student Dashboard Prototype</title>
        <link rel="stylesheet" href="wireframe.css" />
    </head>
    <body class="student-page">
        <a class="skip" href="#student-content">Skip to dashboard content</a>
        <div id="root"></div>
        <script>
            const initialTransactions = [
              {
                id: 'EW-2026-0018',
                date: 'Sep 28, 2026',
                item: 'Small electronics',
                weight: 0.85,
                points: 85,
                status: 'Completed',
              },
              {
                id: 'EW-2026-0017',
                date: 'Sep 23, 2026',
                item: 'Electronic accessories',
                weight: 0.45,
                points: 45,
                status: 'Completed',
              },
              {
                id: 'EW-2026-0016',
                date: 'Sep 18, 2026',
                item: 'Small electronics',
                weight: 1.2,
                points: 120,
                status: 'Completed',
              },
              {
                id: 'EW-2026-0015',
                date: 'Sep 10, 2026',
                item: 'Electronic accessories',
                weight: 0.6,
                points: 60,
                status: 'Completed',
              },
            ];
            const rewardOptions = [
              {
                id: 1,
                name: 'Campus Meal Voucher',
                cost: 120,
                stock: 5,
                desc: 'Sample student meal voucher reward.',
              },
              {
                id: 2,
                name: 'School Supplies Pack',
                cost: 250,
                stock: 3,
                desc: 'Notebook and basic school supplies.',
              },
              {
                id: 3,
                name: 'Reusable Tumbler',
                cost: 400,
                stock: 2,
                desc: 'Reusable drink container reward.',
              },
              {
                id: 4,
                name: 'Campus Merchandise',
                cost: 650,
                stock: 0,
                desc: 'Limited student merchandise.',
              },
              {
                id: 5,
                name: 'Printing Credit',
                cost: 90,
                stock: 8,
                desc: 'Sample printing service credit.',
              },
              {
                id: 6,
                name: 'Eco Tote Bag',
                cost: 300,
                stock: 4,
                desc: 'Reusable tote bag reward.',
              },
            ];
            let state = {
              loggedIn: false,
              page: 'dashboard',
              balance: 710,
              transactions: initialTransactions.map((x) => ({ ...x })),
              rewards: rewardOptions.map((x) => ({ ...x })),
              redemptions: [],
              notifications: [
                {
                  id: 1,
                  title: 'Points updated',
                  message:
                    'Your recent disposal transaction has been added to your account.',
                  date: 'Sep 28, 2026',
                  read: false,
                },
                {
                  id: 2,
                  title: 'Transaction recorded',
                  message: 'Transaction EW-2026-0018 is available in your history.',
                  date: 'Sep 28, 2026',
                  read: false,
                },
                {
                  id: 3,
                  title: 'Welcome to the student portal',
                  message: 'Browse rewards and view your transaction history.',
                  date: 'Sep 02, 2026',
                  read: true,
                },
              ],
              selectedTx: null,
              selectedReward: null,
              search: '',
              historyFilter: 'all',
              rewardFilter: 'all',
            };
            const titles = {
              dashboard: 'Dashboard home',
              profile: 'My profile',
              points: 'Current points',
              history: 'Disposal history',
              organization: 'Organization information',
              leaderboard: 'Leaderboard',
              rewards: 'Available rewards',
              redemption: 'Reward redemption',
              notifications: 'Notifications',
              settings: 'Settings',
              details: 'Transaction details',
            };
            const icons = {
              dashboard: 'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',
              profile: 'M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0 M4 21v-2a8 8 0 0 1 16 0v2',
              points:
                'M20 12a8 8 0 1 1-16 0 8 8 0 0 1 16 0 M12 7v10 M9 10h4a2 2 0 0 1 0 4H9',
              history: 'M6 3h12v18H6z M9 8h6 M9 12h6 M9 16h4',
              organization: 'M3 21h18 M5 21V8h14v13 M3 8l9-5 9 5 M9 11v7 M15 11v7',
              leaderboard: 'M4 21V11h5v10 M9 21V4h6v17 M15 21v-7h5v7',
              rewards:
                'M3 8h18v5H3z M5 13v8h14v-8 M12 8v13 M12 8C3 8 6 1 9 4l3 4c9 0 6-7 3-4z',
              redemption: 'M3 7h16l-4-4 M21 17H5l4 4 M19 7l-4 4 M5 17l4-4',
              settings:
                'M12 3v3 M12 18v3 M3 12h3 M18 12h3 M6 6l2 2 M16 16l2 2 M6 18l2-2 M16 8l2-2 M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0',
              logout: 'M9 3H4v18h5 M9 12h12 M17 8l4 4-4 4',
            };
            function navIcon(name) {
              return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${icons[name]}"/></svg>`;
            }
            function bellIcon(count = 0, sidebar = false) {
              return `<span class="notification-bell ${sidebar ? 'sidebar-bell' : ''}" aria-hidden="true"><svg viewBox="0 0 30 32" xmlns="http://www.w3.org/2000/svg"><path d="M13 4V2.5a2 2 0 0 1 4 0V4"/><path d="M15 4c-6 0-9.2 4.7-9.2 10.5V21c0 1.7-1.5 3.5-3.1 4.5-.8.6-.4 1.8.6 1.8h23.4c1 0 1.4-1.2.6-1.8-1.6-1-3.1-2.8-3.1-4.5v-6.5C24.2 8.7 21 4 15 4Z"/><path d="M11 28c.3 2.2 1.7 3.1 4 3.1s3.7-.9 4-3.1"/></svg>${count > 0 ? `<span class="bell-badge">${count > 99 ? '99+' : count}</span>` : ''}</span>`;
            }
            const root = document.getElementById('root');
            const $ = (id) => document.getElementById(id);
            const money = (n) => Number(n).toLocaleString('en-US');
            function esc(s) {
              return String(s).replace(
                /[&<>"']/g,
                (c) =>
                  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[
                    c
                  ],
              );
            }
            function notify(msg) {
              document.querySelector('.toast')?.remove();
              const message = document.createElement('div');
              message.className = 'toast';
              message.setAttribute('role', 'status');
              document.querySelector('.content').prepend(message);
              message.textContent = msg;
            }

            function go(page) {
              state.page = page;
              state.search = '';
              state.historyFilter = 'all';
              render();
              document.querySelector('.content h1')?.focus();
            }

            function title(sub, description, action = '') {
              return `<div class="heading"><div><h1 tabindex="-1">${esc(sub)}</h1><p>${description}</p></div>${action}</div>`;
            }

            function card(body, cls = '') {
              return `<div class="card card-pad ${cls}">${body}</div>`;
            }
            function secTitle(t, action = '') {
              return `<div class="section-title"><h2>${t}</h2>${action}</div>`;
            }
            function stat(name, num, foot, focal = false) {
              return `<div class="card card-pad ${focal ? 'points-panel' : ''}"><div class="stat-label">${name}</div><div class="stat-num">${num}${focal ? ' <span class="points-unit">pts</span>' : ''}</div><div class="stat-foot">${foot}</div></div>`;
            }

            function txTable(txs) {
              if (!txs.length)
                return '<div class="empty">No transactions found for this filter.</div>';
              return `<div class="table-wrap" role="region" tabindex="0" aria-label="Deposit transactions"><table><thead><tr><th scope="col">Transaction ID</th><th scope="col">Date</th><th scope="col">E-waste category</th><th scope="col" class="numeric">Weight</th><th scope="col" class="numeric">Points earned</th><th scope="col">Status</th><th scope="col">Actions</th></tr></thead><tbody>${txs.map((t) => `<tr><td><strong>${t.id}</strong></td><td>${t.date}</td><td>${t.item}</td><td class="numeric">${t.weight.toFixed(2)} kg</td><td class="numeric">+${t.points}</td><td><span class="tag">${t.status}</span></td><td><button class="linkbtn" data-tx="${t.id}" aria-label="Details for ${t.id}">Details →</button></td></tr>`).join('')}</tbody></table></div>`;
            }

            function dashboard() {
              let total = state.transactions.reduce((a, t) => a + t.weight, 0);
              return (
                title(
                  'Dashboard home',
                  'An overview of your e-waste contributions and reward activity.',
                  '<span class="chip">Wireframe · Mock data</span>',
                ) +
                `<div class="grid stats">${stat('Available points', money(state.balance), 'Redeemable rewards balance', true)}${stat('Successful deposits', state.transactions.length, 'Recorded transactions')}${stat('Total collected weight', total.toFixed(2) + ' kg', 'Across your transactions')}${stat('Your leaderboard rank', '#4', 'Sample student standings')}</div><div class="grid dashboard-sections">${card(secTitle('Recent transactions', '<button class="linkbtn" data-go="history">View all →</button>') + txTable(state.transactions.slice(0, 4)))}<div class="stack">${card(
                  secTitle(
                    'Recent notifications',
                    '<button class="linkbtn" data-go="notifications">View all →</button>',
                  ) +
                    state.notifications
                      .slice(0, 3)
                      .map(
                        (n) =>
                          `<div class="activity"><div><strong>${esc(n.title)}</strong><p>${esc(n.message)} · ${n.date}</p></div></div>`,
                      )
                      .join(''),
                )}${card(secTitle('Rewards preview', '<button class="linkbtn" data-go="rewards">Browse rewards →</button>') + `<div class="between"><div><div class="muted small">Next affordable reward</div><h3 >Printing Credit</h3><div class="small muted">90 points required</div></div></div><div class="divider"></div><button class="btn primary" data-go="rewards">Explore rewards →</button>`)}</div></div><div class="footnote">Prototype note: All balances, names, items and leaderboard entries are illustrative mock data, not live records.</div>`
              );
            }
            function profile() {
              const account = demoAccount();
              return (
                title(
                  'My profile',
                  'Student account information displayed in read-only form.',
                ) +
                card(
                  secTitle('Student information') +
                    `<div class="form-grid">${[
                      ['Full name', account.firstName + ' ' + account.lastName],
                      ['Student ID', account.studentNumber],
                      ['Email address', account.email],
                      ['Organization', account.organization],
                      ['Account type', 'Student'],
                      ['Account status', 'Active'],
                    ]
                      .map(
                        ([l, v]) =>
                          `<div class="field"><label>${l}<input value="${esc(v)}" readonly></label></div>`,
                      )
                      .join(
                        '',
                      )}</div><div class="divider"></div><div class="banner">Profile information is illustrative. The report requires a student profile page; actual editable fields depend on the approved account design.</div>`,
                )
              );
            }
            function points() {
              const earned = state.transactions.reduce((a, t) => a + t.points, 0);
              const spent = state.redemptions.reduce((a, r) => a + r.cost, 0);
              return (
                title('Current points', 'Track your reward balance and activity.') +
                `<div class="grid stats">${stat('Available balance', money(state.balance), 'Points you can redeem', true)}${stat('Sample earned points', money(earned), 'From shown transactions')}${stat('Redeemed this session', money(spent), 'Prototype redemptions')}${stat('Recorded deposits', state.transactions.length, 'Transaction count')}</div>${card(secTitle('Reward point information') + `<p class="muted">Your balance is updated in this prototype when you redeem a reward. The official point conversion and calculation rules must follow the approved project system; no conversion formula is implemented here.</p><div class="divider"></div><div class="between"><strong>Reward balance</strong><strong>${money(state.balance)} points</strong></div><div class="progress"><div style="width:${Math.min(100, (100 * state.balance) / 1000)}%"></div></div><p class="small muted">Illustrative progress toward a 1,000-point target (optional enhancement).</p><button class="btn primary" data-go="rewards">Browse rewards</button>`)}`
              );
            }
            function history() {
              let tx = state.transactions.filter(
                (t) =>
                  (state.historyFilter === 'all' ||
                    t.status.toLowerCase() === state.historyFilter) &&
                  `${t.id} ${t.item} ${t.date}`
                    .toLowerCase()
                    .includes(state.search.toLowerCase()),
              );
              return (
                title(
                  'Disposal history',
                  'View and search your recorded e-waste contributions.',
                ) +
                card(
                  secTitle(
                    'Transaction records',
                    `<span class="chip">${tx.length} results</span>`,
                  ) +
                    `<div class="filters"><div class="field"><label for="historySearch">Search transactions</label><input class="search" id="historySearch" placeholder="Transaction ID, item or date" value="${esc(state.search)}"></div><div class="field"><label for="historyFilter">Transaction status</label><select class="filterselect" id="historyFilter"><option value="all">All statuses</option><option value="completed">Completed</option><option value="failed">Failed</option></select></div></div><div id="historyResults">${txTable(tx)}</div>`,
                )
              );
            }
            function details() {
              let t = state.transactions.find((x) => x.id === state.selectedTx);
              if (!t) return history();
              return (
                title(
                  'Transaction details',
                  'Details for a selected disposal record.',
                  `<button class="btn" data-go="history">← Back to history</button>`,
                ) +
                card(
                  secTitle('Transaction ' + t.id) +
                    `<div class="form-grid">${[
                      ['Transaction reference', t.id],
                      ['Date', t.date],
                      ['Category', t.item],
                      ['Recorded weight', t.weight.toFixed(2) + ' kg'],
                      ['Points earned', '+' + t.points],
                      ['Transaction status', t.status],
                    ]
                      .map(
                        ([l, v]) =>
                          `<div class="field"><label>${l}<input value="${v}" readonly></label></div>`,
                      )
                      .join('')}</div>`,
                )
              );
            }
            function organization() {
              return (
                title(
                  'Organization information',
                  'View the organization associated with your student account.',
                ) +
                card(
                  secTitle('Organization profile') +
                    `<div class="form-grid">${[
                      ['Organization', demoAccount().organization],
                      ['Organization type', 'Academic College'],
                      ['Student affiliation', 'Member'],
                      ['Community activity', 'E-waste participation program'],
                    ]
                      .map(
                        ([l, v]) =>
                          `<div class="field"><label>${l}<input value="${esc(v)}" readonly></label></div>`,
                      )
                      .join(
                        '',
                      )}</div><div class="divider"></div><div class="banner">The source report requires organization information, but does not specify exact institutional fields. The text shown here is placeholder content.</div>`,
                )
              );
            }
            function leaderboard() {
              const account = demoAccount();
              const ownName = account.firstName + ' ' + account.lastName;
              const people = [
                ['1', 'Taylor Lee', 1500],
                ['2', 'Jordan Cruz', 1230],
                ['3', 'Sam Rivera', 980],
                ['4', ownName, state.balance],
                ['5', 'Casey Lim', 650],
                ['6', 'Morgan Reyes', 500],
              ];
              return (
                title(
                  'Leaderboard',
                  'Illustrative student standings based on sample reward points.',
                ) +
                card(
                  secTitle('Student rankings', '<span class="chip">Demo rankings</span>') +
                    `<div class="rank-list">${people.map(([r, n, p]) => `<div class="rank-row ${n === ownName ? 'you' : ''}"><span class="rank-n">#${r}</span><strong>${esc(n)}${n === ownName ? ' (You)' : ''}</strong><strong>${money(p)} pts</strong></div>`).join('')}</div><div class="divider"></div><p class="small muted">The report requires a leaderboard but does not define a final ranking formula. Positions above are static examples and do not recalculate after redemption.</p>`,
                )
              );
            }
            function rewards() {
              const list = state.rewards.filter(
                (r) =>
                  state.rewardFilter === 'all' ||
                  (state.rewardFilter === 'available'
                    ? r.stock > 0
                    : r.cost <= state.balance),
              );
              return (
                title(
                  'Available rewards',
                  'Browse sample rewards and use your available points.',
                  '<span class="chip">Mock catalog</span>',
                ) +
                `<div class="between reward-summary">${card(`<div class="stat-label">Your points</div><div class="stat-num">${money(state.balance)} <span class="points-unit">pts</span></div>`, 'points-panel')}<div class="field"><label for="rewardFilter">Show rewards</label><select class="filterselect" id="rewardFilter"><option value="all">All rewards</option><option value="available">In stock</option><option value="affordable">Within my points</option></select></div></div><div class="reward-grid">${list.map((r) => card(`<h2>${r.name}</h2><p>${r.desc}</p><div class="between reward-price"><strong>${r.cost} points</strong><span class="tag ${r.stock === 0 ? 'warn' : ''}">${r.stock > 0 ? r.stock + ' available' : 'Unavailable'}</span></div><button class="btn ${state.balance >= r.cost && r.stock > 0 ? 'primary' : ''}" data-reward="${r.id}" ${r.stock === 0 ? 'disabled' : ''}>${r.stock === 0 ? 'Not available' : state.balance < r.cost ? 'View requirement' : 'Redeem reward'}</button>`, 'reward-card')).join('')}</div>${!list.length ? card('<div class="empty">No rewards match the selected filter.</div>') : ''}`
              );
            }

            function redemption() {
              return (
                title(
                  'Reward redemption',
                  'Review mock redemption activity. Actual fulfillment is not connected.',
                ) +
                `<div class="grid cols">${card(secTitle('Your redemption history') + (state.redemptions.length ? `<div class="table-wrap" role="region" tabindex="0" aria-label="Redemption history"><table><thead><tr><th scope="col">Reward</th><th scope="col" class="numeric">Points</th><th scope="col">Status</th></tr></thead><tbody>${state.redemptions.map((r) => `<tr><td>${r.name}</td><td class="numeric">-${r.cost}</td><td><span class="tag">Demo confirmed</span></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No rewards redeemed in this demo session yet.</div>'))}${card(secTitle('Available points') + `<div class="stat-num">${money(state.balance)}</div><p class="muted small">Choose a reward from the catalog, review its required points, and confirm your redemption.</p><button class="btn primary" data-go="rewards">Open rewards catalog</button>`)}</div>`
              );
            }
            function notifications() {
              return (
                title(
                  'Notifications',
                  'Read your transaction and reward messages.',
                  `<button class="btn" id="markAll">Mark all as read</button>`,
                ) +
                card(
                  secTitle('Student notifications') +
                    state.notifications
                      .map(
                        (n) =>
                          `<div class="notification ${n.read ? '' : 'unread'}"><div class="notice-copy"><h3>${esc(n.title)} ${n.read ? '' : '<span class="small">(Unread)</span>'}</h3><p>${esc(n.message)}</p><span class="small muted">${n.date}</span></div>${!n.read ? `<button class="linkbtn" data-read="${n.id}">Mark read</button>` : ''}</div>`,
                      )
                      .join(''),
                )
              );
            }
            function settings() {
              return (
                title('Settings', 'Review the interface and this demo session.') +
                `<div class="grid cols">${card(secTitle('Appearance') + '<p>Lavender and white</p><p class="hint">The shared campus design applies throughout this prototype.</p>')}${card(secTitle('Session') + '<p class="muted small">This mock login has no real authentication. Logging out returns you to the demo sign-in page.</p><div class="actions"><button class="btn" id="settingsLogout">Log out</button></div>')}</div>`
              );
            }

            // Prototype marker only; the application uses server guards (API_Design.md §7.1).
            function demoAccount() {
              try {
                const session = JSON.parse(
                  sessionStorage.getItem('ewaste-wireframe-session'),
                );
                const request = JSON.parse(
                  sessionStorage.getItem('ewaste-wireframe-registration'),
                );
                if (request?.email === session?.email && request?.status === 'approved')
                  return request;
              } catch {}
              return {
                firstName: 'Alex',
                lastName: 'Student',
                studentNumber: '2026-00018',
                email: 'student@example.test',
                organization: 'COE',
              };
            }
            function demoRole() {
              try {
                const session = JSON.parse(
                  sessionStorage.getItem('ewaste-wireframe-session'),
                );
                if (
                  session?.role === 'student' &&
                  session.email !== 'student@example.test'
                ) {
                  const request = JSON.parse(
                    sessionStorage.getItem('ewaste-wireframe-registration'),
                  );
                  if (
                    request?.email !== session.email ||
                    request.status !== 'approved' ||
                    !['firstName', 'lastName', 'studentNumber', 'organization'].every(
                      (key) => typeof request[key] === 'string' && request[key].trim(),
                    )
                  )
                    return 'unapproved';
                }
                return session?.role || null;
              } catch {
                return null;
              }
            }
            function login() {
              root.replaceChildren();
              location.replace(
                'access-wireframe.html#' +
                  (demoRole() === 'admin'
                    ? 'denied'
                    : demoRole() === 'unapproved'
                      ? 'registration-status'
                      : 'login'),
              );
            }
            function sidebar() {
              return `<details class="sidebar" id="sidebar" open><summary class="nav-summary" id="menuToggle">Student navigation</summary><div class="brand"><div class="brand-icon" aria-hidden="true">EW</div><div class="brand-copy"><strong>Smart E-Waste</strong><small>Student portal</small></div></div><nav class="nav" aria-label="Student pages">${['dashboard', 'profile', 'points', 'history', 'organization', 'leaderboard', 'rewards', 'redemption', 'notifications', 'settings'].map((p) => `<button class="${state.page === p ? 'active' : ''}" data-go="${p}" ${state.page === p ? 'aria-current="page"' : ''}><span class="symbol">${p === 'notifications' ? bellIcon(state.notifications.filter((n) => !n.read).length, true) : navIcon(p)}</span><span class="label">${titles[p]}</span></button>`).join('')}</nav><div class="side-bottom"><button class="logout" id="logout"><span class="symbol">${navIcon('logout')}</span><span class="label">Log out</span></button></div></details>`;
            }

            function app() {
              const account = demoAccount();
              let unread = state.notifications.filter((n) => !n.read).length;
              let view = (
                {
                  dashboard,
                  profile,
                  points,
                  history,
                  organization,
                  leaderboard,
                  rewards,
                  redemption,
                  notifications,
                  settings,
                  details,
                }[state.page] || dashboard
              )();
              root.innerHTML = `<div class="app">${sidebar()}<div class="main-shell"><header class="topbar"><div class="top-left"><span class="top-title">${titles[state.page]}</span></div><div class="top-right"><span class="mock-label">Interactive wireframe</span><button class="iconbtn bell-button" id="topNotify" aria-label="Notifications${unread ? ` (${unread} unread)` : ``}" title="Notifications">${bellIcon(unread)}</button><div class="avatar">${esc(account.firstName[0] + account.lastName[0])}</div><div class="user-mini"><strong>${esc(account.firstName + ' ' + account.lastName)}</strong><small>Student account · demo</small></div></div></header><main class="content" id="student-content" tabindex="-1">${view}</main></div></div><div id="modalHost"></div>`;
              bind();
            }
            function render() {
              state.loggedIn = demoRole() === 'student';
              state.loggedIn ? app() : login();
            }
            function confirmReward(id) {
              const r = state.rewards.find((x) => x.id === id);
              if (!r) return;
              const enough = state.balance >= r.cost;
              const host = $('modalHost');
              host.innerHTML = `<dialog class="modal" id="rewardDialog" aria-labelledby="reward-title"><h2 id="reward-title">${r.name}</h2><p>${r.desc}</p><div class="divider"></div><div class="between"><span>Required points</span><strong>${r.cost}</strong></div><div class="between"><span>Your points</span><strong>${state.balance}</strong></div><div class="between"><span>Balance after redemption</span><strong>${enough ? state.balance - r.cost : 'Not enough points'}</strong></div>${!enough ? '<p class="field-error">Insufficient points to redeem this reward.</p>' : '<p>This is a prototype. Confirming changes only the displayed demo points and inventory.</p>'}<div class="modal-actions"><button class="btn" id="cancelModal" autofocus>Cancel</button><button class="btn primary" id="confirmModal" ${!enough || r.stock < 1 ? 'disabled' : ''}>Confirm redemption</button></div></dialog>`;
              const dialog = $('rewardDialog');
              $('cancelModal').onclick = () => dialog.close();
              dialog.addEventListener('close', () => host.replaceChildren());
              $('confirmModal').onclick = () => {
                if (state.balance < r.cost || r.stock <= 0) return;
                state.balance -= r.cost;
                r.stock--;
                state.redemptions.unshift({ name: r.name, cost: r.cost });
                state.notifications.unshift({
                  id: Date.now(),
                  title: 'Reward redemption successful',
                  message: `You redeemed ${r.name} for ${r.cost} points (demo only).`,
                  date: 'Just now',
                  read: false,
                });
                state.page = 'redemption';
                render();
                document.querySelector('.content h1').focus();
                notify('Reward redeemed successfully (demo).');
              };
              dialog.showModal();
            }

            function bind() {
              document
                .querySelectorAll('[data-go]')
                .forEach((b) => (b.onclick = () => go(b.dataset.go)));
              document.querySelectorAll('[data-tx]').forEach(
                (b) =>
                  (b.onclick = () => {
                    state.selectedTx = b.dataset.tx;
                    go('details');
                  }),
              );
              document
                .querySelectorAll('[data-reward]')
                .forEach(
                  (b) => (b.onclick = () => confirmReward(Number(b.dataset.reward))),
                );
              document.querySelectorAll('[data-read]').forEach(
                (b) =>
                  (b.onclick = () => {
                    let n = state.notifications.find(
                      (n) => n.id === Number(b.dataset.read),
                    );
                    if (n) n.read = true;
                    render();
                  }),
              );
              if ($('markAll'))
                $('markAll').onclick = () => {
                  state.notifications.forEach((n) => (n.read = true));
                  render();
                  notify('All notifications marked as read.');
                };
              if ($('topNotify')) $('topNotify').onclick = () => go('notifications');
              if ($('logout')) $('logout').onclick = logout;
              if ($('settingsLogout')) $('settingsLogout').onclick = logout;
              if ($('historySearch'))
                $('historySearch').oninput = (e) => {
                  let sel = e.target.selectionStart;
                  state.search = e.target.value;
                  let t = state.transactions.filter(
                    (x) =>
                      (state.historyFilter === 'all' ||
                        x.status.toLowerCase() === state.historyFilter) &&
                      `${x.id} ${x.item} ${x.date}`
                        .toLowerCase()
                        .includes(state.search.toLowerCase()),
                  );
                  $('historyResults').innerHTML = txTable(t);
                  document.querySelectorAll('[data-tx]').forEach(
                    (b) =>
                      (b.onclick = () => {
                        state.selectedTx = b.dataset.tx;
                        go('details');
                      }),
                  );
                };
              if ($('historyFilter')) {
                $('historyFilter').value = state.historyFilter;
                $('historyFilter').onchange = (e) => {
                  state.historyFilter = e.target.value;
                  render();
                };
              }
              if ($('rewardFilter')) {
                $('rewardFilter').value = state.rewardFilter;
                $('rewardFilter').onchange = (e) => {
                  state.rewardFilter = e.target.value;
                  render();
                };
              }
            }
            function logout() {
              try {
                sessionStorage.removeItem('ewaste-wireframe-session');
              } catch {}
              root.replaceChildren();
              location.replace('access-wireframe.html#login');
            }
            addEventListener('pageshow', render);
            render();
        </script>
    </body>
</html>
