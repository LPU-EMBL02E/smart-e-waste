; Temporary ESP32-S3 -> station API connectivity test.
; Not production controller firmware; do not deploy as the bin controller.
;
;   pio run                              build
;   pio run -t upload --upload-port COM7 flash
;   pio device monitor --port COM7       serial log

[env:station_link_test]
; Same pin as firmware/controller: Arduino core 2.0.17, not the 3.x rename.
platform = espressif32@7.1.3
; ESP32-S3-DevKitC-1 N8R2: 8 MB quad flash and 2 MB quad PSRAM. The stock board
; file describes the N8 without PSRAM; memory_type + BOARD_HAS_PSRAM add it.
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=2
    -DBOARD_HAS_PSRAM

lib_deps =
    ; Same WiFiManager pin as the controller: setup portal, no hardcoded Wi-Fi.
    https://github.com/tzapu/WiFiManager.git#v2.0.17
