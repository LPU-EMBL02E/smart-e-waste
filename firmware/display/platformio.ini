; Display firmware — the 7" capacitive touch panel. System_Plan.md §2 and §8.2.
;
; It draws the screens the controller names and reports touches. It never talks
; to the server and never reads a sensor, so it holds no state that matters: a
; panel reboot mid-deposit loses nothing.
;
; TODO(team): System_Plan.md §10 — confirm the exact panel model and how its
; serial connector is selected on that board, then set `board` and the LVGL
; display and touch configuration to match. The example in the plan is the
; Waveshare ESP32-S3-Touch-LCD-7 (800x480).
;
;   pio run -e display -t upload

[env:display]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.arduino.memory_type = qio_opi   ; ESP32-S3 with octal PSRAM

build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    ; TODO(team): LVGL needs an lv_conf.h. Copy lv_conf_template.h from the
    ; installed lvgl library into include/lv_conf.h, enable it, set the colour
    ; depth and the fonts the screens use, then uncomment the line below. The
    ; build fails until that file exists, so it is left commented rather than
    ; pointing at a missing file.
    ; -DLV_CONF_PATH="${PROJECT_INCLUDE_DIR}/lv_conf.h"

lib_deps =
    lvgl/lvgl@^9.2.0
    ; TODO(team): add the panel vendor's display and touch driver once the exact
    ; board is confirmed. An RGB-panel board needs its own init sequence, which
    ; is board-specific and must not be guessed.
