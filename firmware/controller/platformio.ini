; Controller firmware — the ESP32-S3 that runs the deposit sequence.
; System_Plan.md §2 and §8.2.
;
; This is the only board in the bin and the only client of the device API. The
; QR scanner, the camera and the touchscreen are on the Pi, run by the bin
; station; the controller reaches them over HTTP (API_Design.md §11).
;
;   pio run -e controller            build
;   pio run -e controller -t upload  flash
;   pio device monitor               serial log

[env:controller]
; Pinned, like the libraries: platform 8.x moves to Arduino core 3, which
; renames the LEDC calls the actuator and the LED strip use. 7.1.3 is Arduino
; core 2.0.17, the version this code is written and tested against.
platform = espressif32@7.1.3
; ESP32-S3-DevKitC-1, N8R2: 8 MB quad flash and 2 MB quad PSRAM. The stock
; board file describes the N8, with no PSRAM; the two lines below add it.
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; -Wall because a silently truncated integer in a weight calculation is exactly
; the kind of bug that is invisible until calibration goes wrong.
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=2
    -DBOARD_HAS_PSRAM

lib_deps =
    ; Load cell amplifier. Pinned: a minor version bump here changes timing.
    bogde/HX711@^0.7.5
    ; Wi-Fi setup portal, so the server URL, bin station URL, device code and
    ; secret can be changed without reflashing (System_Plan.md §8).
    https://github.com/tzapu/WiFiManager.git#v2.0.17
    ; JSON for the device API and the bin station API. Replies must be read as
    ; either the success body or the nested error shape, and anything else is a
    ; failure (API_Design.md §3.5, P9) — hand-parsing that is where a bad reply
    ; slips through.
    bblanchon/ArduinoJson@7.4.3

; Secrets are NOT compiled in. They live in NVS and are set through the setup
; portal, which is what makes the bin re-pointable at handover.
