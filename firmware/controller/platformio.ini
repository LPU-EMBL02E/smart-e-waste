; Controller firmware — the NodeMCU that runs the deposit sequence.
; System_Plan.md §2 and §8.2.
;
; This is the only board that joins the Wi-Fi network and the only one that
; talks to the server. The ESP32-CAM and the display panel each do one job for
; it over a serial link.
;
;   pio run -e controller            build
;   pio run -e controller -t upload  flash
;   pio device monitor               serial log

[env:controller]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; -Wall because a silently truncated integer in a weight calculation is exactly
; the kind of bug that is invisible until calibration goes wrong.
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=2

lib_deps =
    ; Load cell amplifier. Pinned: a minor version bump here changes timing.
    bogde/HX711@^0.7.5
    ; Software serial for the QR scanner, which only sends and only at 9600 baud.
    plerup/EspSoftwareSerial@^8.2.0
    ; Wi-Fi setup portal, so the server URL, device code and secret can be
    ; changed without reflashing (System_Plan.md §8).
    https://github.com/tzapu/WiFiManager.git#v2.0.17

; Secrets are NOT compiled in. They live in NVS and are set through the setup
; portal, which is what makes the bin re-pointable at handover.
