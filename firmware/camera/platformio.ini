; Camera firmware — the ESP32-CAM. System_Plan.md §2 and §8.2.
;
; It answers one question for the controller: is an item present? It never joins
; the Wi-Fi network and never talks to the server.
;
;   pio run -e camera -t upload
;
; Flashing an AI-Thinker ESP32-CAM needs an external USB-serial adapter and
; GPIO 0 pulled to ground to enter the bootloader.

[env:camera]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200

build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1
    ; The AI-Thinker board has PSRAM; the camera driver needs it for anything
    ; larger than a small frame.
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; esp_camera.h ships with the ESP32 Arduino core, so there is no camera library
; to add here.
